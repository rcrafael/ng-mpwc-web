<div class="flex flex-col p-2 text-sm">
     <div [class]="{'text-green-700': hasEightChar} ">
          <span>* At least 8 character long.</span>
     </div>
     <div [class]="{'text-green-700': hasUpperCase} ">
          <span>* At least 1 Upper case.</span>
     </div>
     <div [class]="{'text-green-700': hasLowerCase} ">
          <span>* At least 1 Lower case.</span>
     </div>
     <div [class]="{'text-green-700': hasNumber} ">
          <span>* At least 1 numeric character.</span>
     </div>
</div>
