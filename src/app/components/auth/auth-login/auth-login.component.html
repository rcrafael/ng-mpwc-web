<div class="flex w-screen h-screen bg-slate-100">
     <div class="m-auto p-4 shadow-xl w-[400px] h-auto bg-white border rounded-md border-slate-200">
          <div class="font-bold text-[24px] text-center m-6">
               <span>
                    MPWC Web Login
               </span>
          </div>
          <div class="mt-10">
               <form [formGroup]="fg" (submit)="onSubmit()" class="grid grid-flow-row gap-5" >
                    <div class="grid grid-cols-12 items-center">
                         <label class="col-span-3">Email:</label>
                         <input type="email" placeholder="example@youremail.com" formControlName="email"
                              class="border rounded-md p-1 w-[100%] col-span-9"
                         />
                         @if(!fg.controls.email.valid && fg.controls.email.touched) {
                              <span class="col-start-4 col-span-9 text-sm text-red-500">Enter valid email address.</span>
                         }
                    </div>
                    <div class="grid grid-cols-12 items-center">
                         <label class="col-span-3">Password:</label>
                         <input type="password" placeholder="myP@ssw0rd"  formControlName="password"
                              class="border rounded-md p-1 w-[100%] col-span-9"
                         />
                         @if(!fg.controls.password.valid && fg.controls.password.touched) {
                              <span class="col-start-4 col-span-9 text-sm text-red-500">Enter your password.</span>
                         }
                    </div>
                    <div class="flex flex-row justify-end">
                         <button type="submit"
                              [disabled]="isLoading"
                              class="border border-gray-500 rounded-md p-1 min-w-[100px] bg-blue-500 hover:bg-blue-600 text-white font-semibold flex items-center justify-center space-x-2 transition disabled:opacity-75 disabled:cursor-not-allowed"
                         >
                              @if (isLoading) {
                                   <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                   </svg>
                                   <span>Logging in...</span>
                              } @else {
                                   <span>Login</span>
                              }
                         </button> 
                    </div>
               </form>
          </div>
     </div>

</div>
