<div class="p-5 shadow-xl h-auto border rounded-md border-slate-200">

     <form [formGroup]="fg" (ngSubmit)="onSubmit()">
          <div class="flex flex-col-12 w-full pb-5 ">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                    <span class="font-bold">BILLING INFORMATION</span>
               </div>
               <div class="flex col-span-6 col-start-7 w-full place-content-end">
                    <button type="submit" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md px-3" >Update</button>
               </div>
          </div>

          <div class="grid grid-col grid-cols-12 w-full gap-12">

               <div class="col-span-4 col-start-1`">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="readingNo"> Reading No. </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="text" id="readingNo" formControlName="readingNo"
                                        class="border border-gray-400 rounded-md">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="accountNo">Account No</label>
                              </div>
                              <div class="col-start-4 col-span-6">
                                   <input type="text" id="accountNo" formControlName="accountNo"
                                        class="border border-gray-400 rounded-md">
                              </div>
                              <!-- <div class="col-start-10 col-span-1">
                                   <button type="button" class="bg-gray-300 w-full rounded-md border border-black border-solid"><span>...</span></button>
                              </div> -->
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="meterNo"> Meter No. </label>
                              </div>
                              <div class="col-start-4 col-span-6">
                                   <input type="text" id="meterNo" formControlName="meterNo"
                                        class="border border-gray-400 rounded-md">
                              </div>
                              <!-- <div class="col-start-10 col-span-1">
                                   <button type="button" class="bg-gray-300 w-full rounded-md border border-black border-solid"><span>...</span></button>
                              </div> -->
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="alias"> Alias </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="text" id="alias" formControlName="alias"
                                        class="border border-gray-400 rounded-md">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="customerName"> Name </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="text" id="customerName" formControlName="customerName"
                                        class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="branchCode"> Branch Code </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="text" id="branchCode" formControlName="branchCode"
                                        class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="address"> Address </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="text" id="address" formControlName="address"
                                        class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>
                    </div>
               </div>

               <div class="col-span-4 col-start-5">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="monthOf"> Month </label>
                              </div>
                              <div class="col-start-4 col-span-6">
                                   <select id="monthOf" class="border border-gray-400 rounded-md w-full" formControlName="monthOf">
                                        <option value=1>January</option>
                                        <option value=2>February</option>
                                        <option value=3>March</option>
                                        <option value=4>April</option>
                                        <option value=5>May</option>
                                        <option value=6>June</option>
                                        <option value=7>July</option>
                                        <option value=8>August</option>
                                        <option value=9>September</option>
                                        <option value=10>October</option>
                                        <option value=11>November</option>
                                        <option value=12>December</option>
                                   </select>
                              </div>
                         </div>
                         
                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="dateFrom"> From </label>
                              </div>
                              <div class="col-start-4 col-span-6">
                                   <input type="date" id="dateFrom" formControlName="dateFrom"
                                        class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="dateTo"> To </label>
                              </div>
                              <div class="col-start-4 col-span-6">
                                   <input type="date" id="dateTo" formControlName="dateTo"
                                        class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3">
                                   <label for="dueDate"> Due Date </label>
                              </div>
                              <div class="col-start-4 col-span-6">
                                   <input type="date" id="dueDate" formControlName="dueDate"
                                        class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-6">
                                   <label for="rememberSettings"> Remember Date Settings </label>
                              </div>
                              <div class="col-start-7 col-span-6">
                                   <input type="checkbox" id="rememberSettings"
                                        class="border border-gray-400 rounded-md">
                              </div>
                         </div>

                         <mat-divider />

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3"> 
                                   <label for="previous"> Previous M3 </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="number" id="previous" formControlName="previous"
                                        class="border border-gray-400 rounded-md" (blur)="onBlurUsage()"/>
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3"> 
                                   <label for="present"> Present M3 </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="number" id="present" formControlName="present"
                                        class="border border-gray-400 rounded-md" (blur)="onBlurUsage()"/>
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-3"> 
                                   <label for="m3Used"> M3 Used </label>
                              </div>
                              <div class="col-start-4 col-span-9">
                                   <input type="number" id="m3Used" formControlName="m3Used"
                                        class="border border-gray-400 rounded-md" />
                              </div>
                         </div>

                    </div>
               </div>

               <div class="col-span-4 col-start-9">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="readingAmount"> Amount </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="readingAmount" formControlName="readingAmount" (change)="computeTotalBillingAmount()"
                                        class="border border-gray-400 rounded-md text-right" />
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="parts"> Parts </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="parts" formControlName="parts" (blur)="onBlurAmounts($event,'parts')"
                                        class="border border-gray-400 rounded-md text-right" />
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="maintenanceFee"> Maintenance Fee </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="maintenanceFee" formControlName="maintenanceFee" (blur)="onBlurAmounts($event,'maintenanceFee')"
                                        class="border border-gray-400 rounded-md text-right" />
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="septageFee"> Septage Fee </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="septageFee" formControlName="septageFee" (blur)="onBlurAmounts($event,'septageFee')"
                                        class="border border-gray-400 rounded-md text-right" />
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="lessAmount"> Less </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="lessAmount" formControlName="lessAmount" (blur)="onBlurAmounts($event,'lessAmount')"
                                        class="border border-gray-400 rounded-md text-right" />
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="totalAmount"> Total Amount </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="totalAmount" formControlName="totalAmount"
                                        class="border border-gray-400 rounded-md text-right" />
                              </div>
                         </div>

                         <div class="grid grid-cols-12">
                              <div class="col-start-1 col-span-4"> 
                                   <label for="status"> Status </label>
                              </div>
                              <div class="col-start-5 col-span-8">
                                   <input type="text" id="status" formControlName="status"
                                        class="border border-gray-400 rounded-md" />
                              </div>
                         </div>
                    </div>
               </div>

          </div>
     </form>
</div>
