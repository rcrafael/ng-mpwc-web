<div class="dialog-container h-[100%] p-2">
     <mat-dialog-content class="!h-[85%]">
          <div class="flex xs:flex-col md:flex-row">
               <div class="xs:my-1 md:mx-2">
                    <label>
                         Search By: 
                    </label>
               </div>
               <div class="xs:my-1 md:mx-2 ">
                    <select id="searchKey" class="border border-black rounded-sm">
                         <option value="name">Customer Name</option>
                         <option value="meterNo">Meter No</option>
                         <option value="accountNo">Account No</option>
                         <option value="customerId">Customer Id</option>
                         <option value="alias">Alias</option>
                    </select>
               </div>
               <div class="xs:my-1 md:mx-2 flex-grow">
                    <input type="text" id="searchValue" class="border border-black rounded-md w-full" />
               </div>
          </div>

          <div class="table-container">
               <table mat-table [dataSource]="dataSource" class="overflow-scroll !w-[100%]">
                    <ng-container matColumnDef="Customer No">
                         <th mat-header-cell *matHeaderCellDef>Customer No</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.customerId}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Account No">
                         <th mat-header-cell *matHeaderCellDef>Account No</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.accountNo}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Meter No">
                         <th mat-header-cell *matHeaderCellDef>Meter No</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.meterNo}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Last Name">
                         <th mat-header-cell *matHeaderCellDef>Last Name</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.lastName}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="First Name">
                         <th mat-header-cell *matHeaderCellDef>First Name</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.firstName}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Middle Name">
                         <th mat-header-cell *matHeaderCellDef>Middle Name</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.middleName}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Branch Code">
                         <th mat-header-cell *matHeaderCellDef>Branch Code</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.branchCode}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Address">
                         <th mat-header-cell *matHeaderCellDef class="min-w-[200px] !text-center">Address</th>
                         <td mat-cell *matCellDef="let element" class="truncate"><span>{{element.address}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Customer Type">
                         <th mat-header-cell *matHeaderCellDef>Customer Type</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.customerType}}</span></td>
                    </ng-container>
     
                    <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
                    <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
               </table>
          </div>

     </mat-dialog-content>
     
     <mat-dialog-actions>
          <div class="flex flex-row w-full gap-3 justify-end">
               <button (click)="onClose()" class="bg-blue-500 text-white rounded border border-black border-solid p-2 w-[80px]">
                    Select
               </button>

               <button (click)="onClose()" class="bg-red-500 text-white rounded border border-black border-solid p-2 w-[80px]">
                    Cancel
               </button>
          </div>
     </mat-dialog-actions>
</div>
