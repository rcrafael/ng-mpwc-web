<div>
     <div class="flex flex-row-reverse">
          <button type="button" class="p-2 bg-green-300 font-bold rounded-md mb-1" (click)="onCreateNewClick()"> Create New</button>
     </div>
     
     <div class="h-screen overflow-y-scroll">
          <table mat-table [dataSource]="dataSource">
               <ng-container matColumnDef="Account No">
                    <th mat-header-cell *matHeaderCellDef>Account No</th>
                    <td mat-cell *matCellDef="let element"> {{element.accountNo}}</td>
               </ng-container>
               <ng-container matColumnDef="Meter No">
                    <th mat-header-cell *matHeaderCellDef>Meter No</th>
                    <td mat-cell *matCellDef="let element"> {{element.meterNo}}</td>
               </ng-container>
               <ng-container matColumnDef="Alias">
                    <th mat-header-cell *matHeaderCellDef>Alias</th>
                    <td mat-cell *matCellDef="let element"> {{element.alias}}</td>
               </ng-container>
               <ng-container matColumnDef="Last Name">
                    <th mat-header-cell *matHeaderCellDef>Last Name</th>
                    <td mat-cell *matCellDef="let element"> {{element.lastName}}</td>
               </ng-container>
               <ng-container matColumnDef="First Name">
                    <th mat-header-cell *matHeaderCellDef>First Name</th>
                    <td mat-cell *matCellDef="let element"> {{element.firstName}}</td>
               </ng-container>
               <ng-container matColumnDef="Middle Name">
                    <th mat-header-cell *matHeaderCellDef>Middle Name</th>
                    <td mat-cell *matCellDef="let element"> {{element.middleName}}</td>
               </ng-container>
               <ng-container matColumnDef="Branch Code">
                    <th mat-header-cell *matHeaderCellDef>Branch Code</th>
                    <td mat-cell *matCellDef="let element"> {{element.branchCode}}</td>
               </ng-container>
               <ng-container matColumnDef="Address">
                    <th mat-header-cell *matHeaderCellDef>Address</th>
                    <td mat-cell *matCellDef="let element"> {{element.address}}</td>
               </ng-container>
               <ng-container matColumnDef="Customer Type">
                    <th mat-header-cell *matHeaderCellDef>Customer Type</th>
                    <td mat-cell *matCellDef="let element"> {{element.customerType}}</td>
               </ng-container>

               <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
               <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
          </table>
     </div>
</div>
