<div class="flex flex-col h-screen m-1">
     <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
          <div class="grid grid-cols-12 w-full">
               <div class="grid col-span-6 col-start-1 w-full place-items-start items-center">
                    <span class="p-2 font-bold">CUSTOMER INFORMATION</span>
               </div>
               <div class="grid col-span-4 col-start-7 w-full place-items-start items-center">
                    <div class="flex flex-row items-center gap-2 flex-1 w-full px-1">
                         <span class="text-gray-400">SEARCH:</span>
                         <input 
                              type="text" 
                              [(ngModel)]="searchKeyword" 
                              (ngModelChange)="onSearchInputChanged($event)"
                              placeholder="Please search Customer Name / Account No. / Address" 
                              class="w-full rounded-md" 
                         />
                    </div>
                   
               </div>
               <div class="grid col-span-2 col-start-11 w-full place-items-end items-center">
                    <button type="button" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md " (click)="onCreateNewClick()"> Create New</button>
               </div>
          </div>
          
     </div>
     
     <div class="flex flex-col flex-1 min-h-0">
          <div *ngIf="dataSource.data.length === 0">
               <div>Please wait while loading...</div>
          </div>
          <div class="flex-1 overflow-auto min-h-0">
               <div *ngIf="dataSource.data.length > 0"  class="h-full">
                    <table mat-table [dataSource]="dataSource" class="w-full border-collapse">
                         <!-- <ng-container matColumnDef="Customer No">
                              <th mat-header-cell *matHeaderCellDef>Customer No</th>
                              <td mat-cell *matCellDef="let element"> </td>
                         </ng-container> -->
                         <ng-container matColumnDef="Account No">
                              <th mat-header-cell *matHeaderCellDef>Account No</th>
                              <td mat-cell *matCellDef="let element"> <a [routerLink]="['/customer',element.id]" ><span > {{element.accountNo}}</span></a> </td>
                         </ng-container>
                         <ng-container matColumnDef="Last Name">
                              <th mat-header-cell *matHeaderCellDef>Last Name</th>
                              <td mat-cell *matCellDef="let element"> <span>{{element.lastName}}</span> </td>
                         </ng-container>
                         <ng-container matColumnDef="First Name">
                              <th mat-header-cell *matHeaderCellDef>First Name</th>
                              <td mat-cell *matCellDef="let element"> <span>{{element.firstName}}</span> </td>
                         </ng-container>
                         <ng-container matColumnDef="Middle Name">
                              <th mat-header-cell *matHeaderCellDef>Middle Name</th>
                              <td mat-cell *matCellDef="let element"> <span>{{element.middleName}}</span> </td>
                         </ng-container>
                         <ng-container matColumnDef="Address">
                              <th mat-header-cell *matHeaderCellDef>Address</th>
                              <td mat-cell *matCellDef="let element"> <span>{{element.address}}</span> </td>
                         </ng-container>
                         <ng-container matColumnDef="Birth Date">
                              <th mat-header-cell *matHeaderCellDef>Birth Date</th>
                              <td mat-cell *matCellDef="let element"> <span>{{element.dateOfBirth}}</span> </td>
                         </ng-container>
                         <ng-container matColumnDef="Gender">
                              <th mat-header-cell *matHeaderCellDef>Gender</th>
                              <td mat-cell *matCellDef="let element"> <span>{{getGender(element.gender)}}</span> </td>
                         </ng-container>
                         <ng-container matColumnDef="Actions">
                              <th mat-header-cell *matHeaderCellDef class="!text-center"><span>Actions</span></th>
                              <td mat-cell *matCellDef="let element">
                                   <div class="flex flex-row gap-4 justify-center">
                                        <mat-icon 
                                             fontIcon="print" 
                                             class="cursor-pointer text-blue-500 font"
                                             matTooltip="Print Billing Receipt"
                                        ></mat-icon>
                                        <mat-icon 
                                             fontIcon="cancel"
                                             matTooltip="Void Billing"
                                             class="cursor-pointer text-black" 
                                        ></mat-icon>
                                        <mat-icon 
                                             fontIcon="delete_forever"
                                             matTooltip="Delete Billing"
                                             class="cursor-pointer text-red-500" 
                                        ></mat-icon>
                                   </div>
                              </td>
                         </ng-container>


                         <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
                         <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
                    </table>
               </div>
          </div>
          
          <mat-paginator
               showFirstLastButtons
               aria-label="Select page of customers"
               [pageSizeOptions]="[50,100,200]"
               (page)="handlePageChange($event)"
               
          >
          </mat-paginator>
     </div>
     
     
     
</div>
