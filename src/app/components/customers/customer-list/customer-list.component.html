<div>
     <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
          <div class="flex flex-col-12  w-full">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                    <span class="p-2 font-bold">CUSTOMER INFORMATION</span>
               </div>
               <div class="flex col-span-6 col-start-7 w-full place-content-end">
                    <button type="button" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md " (click)="onCreateNewClick()"> Create New</button>
               </div>
          </div>
          
     </div>
     
     <div class="h-screen overflow-y-scroll">
          <table mat-table [dataSource]="dataSource">
               <ng-container matColumnDef="Customer No">
                    <th mat-header-cell *matHeaderCellDef>Customer No</th>
                    <td mat-cell *matCellDef="let element"> <a [routerLink]="['/customer',element.customerId]" ><span >{{element.customerId}}</span></a> </td>
               </ng-container>
               <!-- <ng-container matColumnDef="Account No">
                    <th mat-header-cell *matHeaderCellDef>Account No</th>
                    <td mat-cell *matCellDef="let element"> {{element.accountNo}}</td>
               </ng-container> -->
               <!-- <ng-container matColumnDef="Meter No">
                    <th mat-header-cell *matHeaderCellDef>Meter No</th>
                    <td mat-cell *matCellDef="let element"> {{element.meterNo}}</td>
               </ng-container>
               <ng-container matColumnDef="Alias">
                    <th mat-header-cell *matHeaderCellDef>Alias</th>
                    <td mat-cell *matCellDef="let element"> {{element.alias}}</td>
               </ng-container> -->
               <ng-container matColumnDef="Last Name">
                    <th mat-header-cell *matHeaderCellDef>Last Name</th>
                    <td mat-cell *matCellDef="let element"> <span>{{element.lastName}}</span> </td>
               </ng-container>
               <ng-container matColumnDef="First Name">
                    <th mat-header-cell *matHeaderCellDef>First Name</th>
                    <td mat-cell *matCellDef="let element"> <span>{{element.firstName}}</span> </td>
               </ng-container>
               <ng-container matColumnDef="Middle Name">
                    <th mat-header-cell *matHeaderCellDef>Middle Name</th>
                    <td mat-cell *matCellDef="let element"> <span>{{element.middleName}}</span> </td>
               </ng-container>
               <ng-container matColumnDef="Branch Code">
                    <th mat-header-cell *matHeaderCellDef>Branch Code</th>
                    <td mat-cell *matCellDef="let element"> <span>{{element.branchCode}}</span> </td>
               </ng-container>
               <ng-container matColumnDef="Address">
                    <th mat-header-cell *matHeaderCellDef>Address</th>
                    <td mat-cell *matCellDef="let element"> <span>{{element.address}}</span> </td>
               </ng-container>
               <ng-container matColumnDef="Customer Type">
                    <th mat-header-cell *matHeaderCellDef>Customer Type</th>
                    <td mat-cell *matCellDef="let element"> <span>{{element.customerType}}</span> </td>
               </ng-container>

               <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
               <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
          </table>
          <mat-paginator
               [pageSizeOptions]="[20,50,100]"
               showFirstLastButtons
               aria-label="Select page of customers"
               [pageSize]="20"
          >
          </mat-paginator>
     </div>
</div>
