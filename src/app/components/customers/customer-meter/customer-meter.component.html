<mat-expansion-panel>
     <mat-expansion-panel-header class="mb-2">
          <mat-panel-title class="p-3 font-bold"> <span class="text-white">Meter Information</span> </mat-panel-title>
          <mat-icon fontIcon="speed" class="m-3"></mat-icon>
     </mat-expansion-panel-header>


     
     <form [formGroup]="fg" (submit)="onSaveClick()">
          
          <div class="d-flex flex-col w-full my-2">
               <div class="flex place-content-end">
                    <ng-container *ngIf="!isFieldsVisible">
                         <button type="button" (click)="onAddNewClick()" class="bg-blue-300 font-bold border border-solid border-black rounded-md py-2 px-3">
                              Add New Meter
                         </button>
                    </ng-container>
                    <ng-container *ngIf="isFieldsVisible">
                         <button type="submit" class="bg-blue-300 font-bold border border-solid border-black rounded-md py-2 px-3">
                              Save
                         </button>
                    </ng-container>
               </div>
          </div>

          <ng-container *ngIf="isFieldsVisible">
               <div class="grid grid-col grid-cols-12 w-full gap-12 mb-5 mt-3" >
                    <div class="col-span-6 col-start-1">
                         <div class="grid grid-row gap-3">
                              <div class="grid grid-cols-12">
                                   <div class="col-start-1 col-span-4">
                                        <label for="cm_meterNo"> Meter No: </label>
                                   </div>
                                   <div class="col-start-5 col-span-8">
                                        <input type="text" id="cm_meterNo" formControlName="meterNo" class="border border-gray-400 rounded-md"/>
                                   </div>
                              </div>
          
                              <div class="grid grid-cols-12">
                                   <div class="col-start-1 col-span-4">
                                        <label for="cm_alias"> Alias: </label>
                                   </div>
                                   <div class="col-start-5 col-span-8">
                                        <input type="text" id="cm_alias" formControlName="alias" class="border border-gray-400 rounded-md w-full"/>
                                   </div>
                              </div>
                         </div>
                    </div>
     
                    <div class="col-span-6 col-start-7">
                         <div class="grid grid-row gap-3">
                              <div class="grid grid-cols-12">
                                   <div class="col-start-1 col-span-4">
                                        <label for="cm_previous"> Previous: </label>
                                   </div>
                                   <div class="col-start-5 col-span-8">
                                        <input type="text" id="cm_previous" formControlName="previous" class="border border-gray-400 rounded-md"/>
                                   </div>
                              </div>
          
                              <div class="grid grid-cols-12">
                                   <div class="col-start-1 col-span-4">
                                        <label for="cm_present"> Present: </label>
                                   </div>
                                   <div class="col-start-5 col-span-8">
                                        <input type="text" id="cm_present" formControlName="present" class="border border-gray-400 rounded-md"/>
                                   </div>
                              </div>
                         </div>
                    </div>
               </div>
          </ng-container>
     </form>

     <div class="overflow-x-auto">
          <table mat-table [dataSource]="dataSource">
               <ng-container matColumnDef="Meter No">
                    <th mat-header-cell *matHeaderCellDef>Meter No</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.meterNo}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Alias">
                    <th mat-header-cell *matHeaderCellDef>Alias</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.alias}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Previous">
                    <th mat-header-cell *matHeaderCellDef>Previous</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.previous}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Present">
                    <th mat-header-cell *matHeaderCellDef>Present</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.present}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let element"><span>{{getStatus(element.status)}}</span></td>
               </ng-container>

               <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
               <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
          </table>
     </div>

</mat-expansion-panel>
