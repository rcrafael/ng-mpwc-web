<mat-expansion-panel>
     <mat-expansion-panel-header class="mb-2">
          <mat-panel-title class="p-3 font-bold"> <span class="text-white">Meter Information</span> </mat-panel-title>
          <mat-icon fontIcon="speed" class="m-3"></mat-icon>
     </mat-expansion-panel-header>

     <div class="grid grid-col grid-cols-12 w-full gap-12" >
          <div class="col-span-6 col-start-1">
               <div class="grid grid-row gap-3">
                    <div class="grid grid-cols-12">
                         <div class="col-start-1 col-span-4">
                              <label for="shareCapBeginning"> Share Capital Beginning: </label>
                         </div>
                         <div class="col-start-5 col-span-8">
                              <input type="text" id="shareCapBeginning" class="border border-gray-400 rounded-md" disabled/>
                         </div>
                    </div>

                    <div class="grid grid-cols-12">
                         <div class="col-start-1 col-span-4">
                              <label for="cbu"> CBU: </label>
                         </div>
                         <div class="col-start-5 col-span-8">
                              <input type="text" id="cbu" class="border border-gray-400 rounded-md" disabled/>
                         </div>
                    </div>

                    <div class="grid grid-cols-12">
                         <div class="col-start-1 col-span-4">
                              <label for="divident"> Divident: </label>
                         </div>
                         <div class="col-start-5 col-span-8">
                              <input type="text" id="divident" class="border border-gray-400 rounded-md" disabled/>
                         </div>
                    </div>

                    <div class="grid grid-cols-12">
                         <div class="col-start-1 col-span-4">
                              <label for="rate"> Rate: </label>
                         </div>
                         <div class="col-start-5 col-span-8">
                              <input type="text" id="rate" class="border border-gray-400 rounded-md" disabled/>
                         </div>
                    </div>

                    <div class="grid grid-cols-12">
                         <div class="col-start-1 col-span-4">
                              <label for="patronageRefundWater"> Patronage Refund Water: </label>
                         </div>
                         <div class="col-start-5 col-span-8">
                              <input type="text" id="patronageRefundWater" class="border border-gray-400 rounded-md" disabled/>
                         </div>
                    </div>

                    <div class="grid grid-cols-12">
                         <div class="col-start-1 col-span-4">
                              <label for="patronageRefundRefilling"> Patronage Refund Refilling: </label>
                         </div>
                         <div class="col-start-5 col-span-8">
                              <input type="text" id="patronageRefundRefilling" class="border border-gray-400 rounded-md" disabled/>
                         </div>
                    </div>
               </div>
          </div>

     </div>

     <div class="overflow-x-auto">
          <table mat-table [dataSource]="dataSource">
               <ng-container matColumnDef="Meter No">
                    <th mat-header-cell *matHeaderCellDef>Meter No</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.meterNo}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Alias">
                    <th mat-header-cell *matHeaderCellDef>Alias</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.alias}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Previous">
                    <th mat-header-cell *matHeaderCellDef>Previous</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.previous}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Present">
                    <th mat-header-cell *matHeaderCellDef>Present</th>
                    <td mat-cell *matCellDef="let element"><span>{{element.present}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let element"><span>{{getStatus(element.status)}}</span></td>
               </ng-container>

               <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
               <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
          </table>
     </div>

</mat-expansion-panel>
