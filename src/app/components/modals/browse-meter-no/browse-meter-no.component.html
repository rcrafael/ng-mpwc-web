<div class="dialog-container">
     <mat-dialog-content>
          <div class="flex flex-col gap-2 ">
               <div class="mb-[10px] font-bold text-lg">
                    <span>Select Billing Details</span>
               </div>
               <div class="search-bar-container flex flex-row gap-2">
                    <div>
                         <label for="searchBar" class="text-black">Search Reading No.</label>
                    </div>
                    <div>
                         <input type="text" id="searchBar" placeholder="Search" class="border border-solid border-black rounded-md sm:w-full md:w-80" />
                    </div>
               </div>
     
               <div class="table-container "> 
                    <table mat-table [dataSource]="dataSource" class="block">
                         <ng-container matColumnDef="Meter No">
                              <th mat-header-cell *matHeaderCellDef class="min-w-[120px]"><span>Meter No</span></th>
                              <td mat-cell *matCellDef="let element"><span class="underline text-blue-500 cursor-pointer" (click)="onSelectMeter(element)">{{element.meterNo}}</span></td>
                         </ng-container>

                         <ng-container matColumnDef="Alias">
                              <th mat-header-cell *matHeaderCellDef class="min-w-[120px]"><span>Alias</span></th>
                              <td mat-cell *matCellDef="let element"><span>{{element.alias}}</span></td>
                         </ng-container>

                         <ng-container matColumnDef="Status">
                              <th mat-header-cell *matHeaderCellDef class="min-w-[120px]"><span>Status</span></th>
                              <td mat-cell *matCellDef="let element"><span>{{getStatus(element.status)}}</span></td>
                         </ng-container>

                         <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
                         <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
                    </table>
               </div>
          </div>
     </mat-dialog-content>

     <mat-dialog-actions>
          <div class="flex flex-row w-full gap-3 justify-end">
               <button (click)="onClose()" class="bg-blue-500 text-white rounded border border-black border-solid p-2 w-[80px]">
                    Select
               </button>

               <button (click)="onClose()" class="bg-red-500 text-white rounded border border-black border-solid p-2 w-[80px]">
                    Cancel
               </button>
          </div>
     </mat-dialog-actions>

</div>
