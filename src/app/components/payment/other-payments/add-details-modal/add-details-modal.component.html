<div class="dialog-container h-[100%]">
     <mat-dialog-content class="!h-[90%]">
          <div class="mb-[10px] font-bold text-lg">
               <span>Payment Details</span>
          </div>

          <div class="table-container h-[200px] border border-solid border-black rounded-md overflow-y-auto">
               <table mat-table [dataSource]="datasource" class="border border-solid border-slate-400 rounded-md" >
                    <ng-container matColumnDef="Description">
                         <th mat-header-cell *matHeaderCellDef ><span>Description</span></th>
                         <td mat-cell *matCellDef="let element"><span>{{element.description}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Remarks">
                         <th mat-header-cell *matHeaderCellDef ><span>Remarks</span></th>
                         <td mat-cell *matCellDef="let element"><span>{{element.remarks}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Amount">
                         <th mat-header-cell *matHeaderCellDef ><span>Amount</span></th>
                         <td mat-cell *matCellDef="let element"><span>{{formatNumber(sanitizeAmount(element.amount))}}</span></td>
                    </ng-container>
                    <ng-container matColumnDef="Action">
                         <th mat-header-cell *matHeaderCellDef class="w-[120px]"><span>Action</span></th>
                         <td mat-cell *matCellDef="let element">
                              <mat-icon fontIcon="delete_forever" class="cursor-pointer" (click)="handleRowDelete(element)">
                              </mat-icon>
                         </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
                    <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
               </table> 
          </div>

          <div class="mt-10 px-4">
               <form (submit)="handleSubmit($event)" [formGroup]="fg">

                    

                    <div class="grid grid-col grid-cols-12 w-full">
                         <!-- first column -->
                         <div class="xs:col-span-12 md:col-span-6">
                              <div class="grid grid-row gap-2">
                                   <div class="grid grid-cols-12 gap-2">
                                        <div class="xs:col-span-12 md:col-span-4">
                                             <label for="othersDescription">Item Description</label>
                                        </div>
                                        <div class="xs:col-span-12 md:col-span-6">
                                             <!-- <input id="othersAmount" type="text" class="border border-gray-400 rounded-md w-full"/> -->
                                             <select formControlName="partId"
                                                  class="w-full border border-black border-solid rounded-md"
                                                  (change)="handlePartChange($event)"
                                             >
                                                  <option [value]="null" hidden disabled selected>Select Part</option> <!-- placeholder -->
                                                  @for(part of partsList; track part.id) {
                                                       <option [value]="part.id">{{part.description}}</option>
                                                  }
                                             </select>


                                             
                                        </div>
                                   </div>

                                   <div class="grid grid-cols-12 gap-2">
                                        <div class="xs:col-span-12 md:col-span-4">
                                             <label for="parts">Amount</label>
                                        </div>
                                        <div class="xs:col-span-12 md:col-span-6">
                                             <input type="text" id="parts"
                                                  formControlName="sellingPrice"
                                                  (blur)="handleAmountOnBlur($event)"
                                                  class="border border-gray-400 rounded-md w-full" 
                                             />
                                        </div>
                                   </div>
                                   
                                   <div class="grid grid-cols-12 gap-2">
                                        <div class="xs:col-span-12 md:col-span-4">
                                             <label for="remarks">Remarks</label>
                                        </div>
                                        <div class="xs:col-span-12 md:col-span-6">
                                             <textarea id="address" rows="3" formControlName="remarks" class="border border-gray-400 rounded-md resize-none w-full px-1"></textarea>
                                        </div>
                                   </div>

                              </div>
                         </div>

                        
                    </div>

                    <div class="grid grid-col grid-cols-12 w-full mt-4">
                         <div class="xs:col-span-12 md:col-span-1">
                              <button type="submit" class="bg-green-300 border border-solid border-black text-black rounded-md w-[80px] p-1" >Add</button>
                         </div>
                         <div class="xs:col-span-12 md:col-span-1">
                              <button type="button" class="bg-red-300 border border-solid border-black text-black rounded-md w-[80px] p-1"
                                   (click)="handleReset()">
                                   Reset
                              </button>
                         </div>
                    </div>
               </form>
          </div>


     </mat-dialog-content>

     <mat-dialog-actions>
          <div class="flex flex-row w-full gap-3 justify-end">
               <button (click)="handleDoneButton()" class="bg-blue-500 text-white rounded border border-black border-solid p-2 w-[80px]">
                    Done
               </button>

               <button (click)="handleCancelButton()" class="bg-red-500 text-white rounded border border-black border-solid p-2 w-[80px]">
                    Cancel
               </button>
          </div>
     </mat-dialog-actions>
</div>
