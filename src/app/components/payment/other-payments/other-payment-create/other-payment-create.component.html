<div class="p-5 shadow-xl h-auto border rounded-md border-slate-200">
     <form (ngSubmit)="onSubmit()" [formGroup]="fg">
          <div class="flex flex-col-12 w-full pb-5 ">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                    <span class="font-bold">CREATE OTHER COLLECTION</span>
               </div>
               <div class="flex col-span-6 col-start-7 w-full place-content-end">
                    <button type="button" class="p-2 bg-red-300 font-bold border border-solid border-black rounded-md px-3 mr-3" >Reset</button>
                    <button type="submit" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md px-3" >Save</button>
               </div>
          </div>

          <div class="grid grid-col grid-cols-12 w-full ">
               <!-- personal info -->
               <div class="xs:col-span-12 md:col-span-4 col-start-1">
                    <div class="grid grid-row gap-3">

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-4">
                                   <label for="isOutsideCollection">Outside Collection</label>
                              </div>
                              <div class="xs:col-span-8 md:col-span-6">
                                   <input type="checkbox" id="isOutsideCollection" formControlName="isOutsideCollection" class="border border-gray-400 rounded-md" (change)="onCheckChanged($event)">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="accountNo">Account No</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="accountNo"  class="border border-gray-400 rounded-md w-full" formControlName="accountNo">
                              </div>
                              <div class="xs:col-span-2 md:col-span-1">
                                   <button type="button" class="bg-gray-300 w-fit px-[10px] rounded-md border border-black border-solid"><span>...</span></button>
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="col-span-3">
                                   <label for="customerName">Name</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-9">
                                   <input type="text" id="customerName" class="border border-gray-400 rounded-md w-full" formControlName="customerName">
                              </div>
                         </div>


                         <div class="grid grid-cols-12 gap-2">
                              <div class="col-span-3">
                                   <label for="address">Address</label>
                              </div>
                              <div class="xs:col-span-12 md:col-span-9">
                                   <textarea id="address" rows="3" [disabled]="!isOutsideCollection" class="border border-gray-400 rounded-md resize-none w-full" formControlName="address">
                                   </textarea>
                              </div>
                         </div>
                    </div>
               </div>

               <!-- OR info -->
               <div class="xs:col-span-12 md:col-span-4 col-start-1 md:ml-[20px]">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="orNo">OR No</label>
                              </div>
                              <div class="xs:col-span-8 md:col-span-6">
                                   <input type="text" id="orNo" class="border border-gray-400 rounded-md w-full" formControlName="orNo">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="orDate">OR Date</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="date" id="orDate" class="border border-gray-400 rounded-md w-full" formControlName="orDate">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="entryDate">Entry Date</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="date" readonly id="entryDate" class="border border-gray-400 rounded-md w-full" formControlName="entryDate">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="createdBy">Created By</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="createdBy" class="border border-gray-400 rounded-md w-full" formControlName="createdBy">
                              </div>
                         </div>

                    </div>
               </div>

               <!-- Payment info -->
               <div class="xs:col-span-12 md:col-span-4 col-start-1 md:ml-[20px]">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="totalAmtToPay" class="md:text-sm">Total Amount To Pay</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="totalAmtToPay" class="border border-gray-400 rounded-md w-full" formControlName="totalAmountPay">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="checkNo" class="md:text-sm">Check No</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="checkNo" class="border border-gray-400 rounded-md w-full" formControlName="checkNo">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="bankName" class="md:text-sm">Bank Name</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="bankName" class="border border-gray-400 rounded-md w-full" formControlName="checkBank">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="checkDate" class="md:text-sm">Check Date</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="date" id="checkDate" class="border border-gray-400 rounded-md w-full" formControlName="checkDate">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="amountReceived" class="md:text-sm">Amount Received</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="amountReceived" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="changeAmt" class="md:text-sm">Change</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" readonly id="changeAmt" class="border border-gray-400 rounded-md w-full" >
                              </div>
                         </div>

                    </div>
               </div>

          </div>


          <mat-divider  class="!my-5"/>

          <div class="flex flex-col-12 w-full pb-5 ">
               <div class="flex flex-col-6">
                    <button type="button" (click)="openDetailFormDialog()" class="p-2 bg-blue-300 font-bold border border-solid border-black rounded-md px-3" >Add</button>
               </div>
          </div>
          <div class="overflow-x-scroll overflow-y-hidden">
               <table mat-table [dataSource]="dataSource">
                    <ng-container matColumnDef="Parts">
                         <th mat-header-cell *matHeaderCellDef>Parts Amount</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.parts}}</span></td>
                    </ng-container>

                    <ng-container matColumnDef="Item Name">
                         <th mat-header-cell *matHeaderCellDef>Item Name</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.otherDescription}}</span></td>
                    </ng-container>

                    <ng-container matColumnDef="Remarks">
                         <th mat-header-cell *matHeaderCellDef>Remarks</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.remarks}}</span></td>
                    </ng-container>

                    <ng-container matColumnDef="Total Amount">
                         <th mat-header-cell *matHeaderCellDef>Total Amount</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.totalAmount}}</span></td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="tableColumns; sticky: true" ></tr>
                    <tr mat-row *matRowDef="let row; columns: tableColumns;"></tr>
               </table>
          </div>
     
     </form>

</div>
