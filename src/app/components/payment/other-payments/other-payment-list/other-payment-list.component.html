<div>
     <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
          <div class="flex flex-col-12  w-full">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                    <span class="p-2 font-bold">OTHER COLLECTION</span>
               </div>
               <div class="flex col-span-6 col-start-7 w-full place-content-end">
                    <button type="button" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md " (click)="onCreateNewClick()"> Create New</button>
               </div>
          </div>
          
     </div>
     
     <div class="max-h-[90vh] overflow-x-scroll">
          <table mat-table [dataSource]="dataSource">
               <ng-container matColumnDef="Official Receipt No">
                    <th mat-header-cell *matHeaderCellDef><span>OR No</span></th>
                    <td mat-cell *matCellDef="let element"> <a [routerLink]="['/payment/official-receipt/',element.orNo]" ><span>{{element.orNo}}</span></a> </td>
               </ng-container>
               <ng-container matColumnDef="OR Date">
                    <th mat-header-cell *matHeaderCellDef><span>OR Date</span></th>
                    <td mat-cell *matCellDef="let element"><span>{{element.orDate}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Meter No">
                    <th mat-header-cell *matHeaderCellDef><span>Meter No</span></th>
                    <td mat-cell *matCellDef="let element"><span>{{element.meterNo}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Customer No">
                    <th mat-header-cell *matHeaderCellDef><span>Customer No</span></th>
                    <td mat-cell *matCellDef="let element"><span>{{element.customerId}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Customer Name">
                    <th mat-header-cell *matHeaderCellDef><span>Customer Name</span></th>
                    <td mat-cell *matCellDef="let element"><span>{{element.customerName}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Total Amount To Pay">
                    <th mat-header-cell *matHeaderCellDef><span>Total Amount To Pay</span></th>
                    <td mat-cell *matCellDef="let element"><span>{{element.totalAmountToPay}}</span></td>
               </ng-container>
               <ng-container matColumnDef="Status">
                    <th mat-header-cell *matHeaderCellDef><span>Status</span></th>
                    <td mat-cell *matCellDef="let element"><span>{{element.status}}</span></td>
               </ng-container>

               <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
               <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
          </table>
     </div>

</div>
