<div class="p-5 shadow-xl h-auto border rounded-md border-slate-200">
     <form [formGroup]="fg">
          <div class="flex flex-col-12 w-full pb-5 ">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                    <span class="font-bold">VIEW OTHER COLLECTION</span>
               </div>
               <!-- <div class="flex col-span-6 col-start-7 w-full place-content-end">
                    <button type="button" class="p-2 bg-red-300 font-bold border border-solid border-black rounded-md px-3 mr-3" >Reset</button>
                    <button type="submit" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md px-3" >Save</button>
               </div> -->
          </div>

          <div class="grid grid-col grid-cols-12 w-full ">
               <!-- personal info -->
               <div class="xs:col-span-12 md:col-span-4 col-start-1">
                    <div class="grid grid-row gap-3">

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="isOutsideCollection">Outside Collection</label>
                              </div>
                              <div class="xs:col-span-8 md:col-span-6">
                                   <input type="checkbox" id="isOutsideCollection" formControlName="isOutsideCollection" class="border border-gray-400 rounded-md" readonly>
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="accountNo">Account No</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="accountNo" formControlName="accountNo" class="border border-gray-400 rounded-md w-full" readonly>
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="col-span-3">
                                   <label for="customerName">Name</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-9">
                                   <input type="text" id="customerName" formControlName="customerName" class="border border-gray-400 rounded-md w-full" readOnly>
                              </div>
                         </div>

                         <!-- <div class="grid grid-cols-12 gap-2">
                              <div class="col-span-3">
                                   <label for="branchCode">Branch Code</label>
                              </div>
                              <div class="xs:col-span-12 md:col-span-9">
                                   <select id="branchCode" formControlName="branchCode" class="border border-gray-400 rounded-md w-full">
                                        @for (br of branchCodes; track br) {
                                             <option [value]="br.id">{{br.name}}</option>
                                        }
                                   </select>
                              </div>
                         </div> -->

                         <div class="grid grid-cols-12 gap-2">
                              <div class="col-span-3">
                                   <label for="address">Address</label>
                              </div>
                              <div class="xs:col-span-12 md:col-span-9">
                                   <textarea id="address" rows="3" formControlName="address" class="border border-gray-400 rounded-md resize-none w-full" readonly>
                                   </textarea>
                              </div>
                         </div>
                    </div>
               </div>

               <!-- OR info -->
               <div class="xs:col-span-12 md:col-span-4 col-start-1 md:ml-[20px]">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="orNo">OR No</label>
                              </div>
                              <div class="xs:col-span-8 md:col-span-6">
                                   <input type="text" id="orNo" formControlName="orNo" class="border border-gray-400 rounded-md w-full" readonly>
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="orDate">OR Date</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="date" id="orDate" formControlName="orDate" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="entryDate">Entry Date</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="date" readonly id="entryDate" formControlName="entryDate" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-3">
                                   <label for="createdDate">Created By</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="createdDate" readonly formControlName="createdBy" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                    </div>
               </div>

               <!-- Payment info -->
               <div class="xs:col-span-12 md:col-span-4 col-start-1 md:ml-[20px]">
                    <div class="grid grid-row gap-3">
                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="totalBillingAmount">Total Billing Amt</label>
                              </div>
                              <div class="xs:col-span-8 md:col-span-6">
                                   <input type="text" id="totalBillingAmount" formControlName="totalBillingAmount" class="border border-gray-400 rounded-md w-full" readonly>
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="totalAmountPay" class="md:text-sm">Total Amount To Pay</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="totalAmountPay" formControlName="totalAmountPay" class="border border-gray-400 rounded-md w-full" readonly> 
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="checkNo" class="md:text-sm">Check No</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="checkNo" formControlName="checkNo" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="checkBank" class="md:text-sm">Bank Name</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="text" id="checkBank" formControlName="checkBank" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                         <div class="grid grid-cols-12 gap-2">
                              <div class="xs:col-span-12 md:col-span-5">
                                   <label for="checkDate" class="md:text-sm">Check Date</label>
                              </div>
                              <div class="xs:col-span-10 md:col-span-6">
                                   <input type="date" id="checkDate" formControlName="checkDate" class="border border-gray-400 rounded-md w-full">
                              </div>
                         </div>

                    </div>
               </div>

          </div>


          <mat-divider  class="!my-5"/>

          <!-- <div class="flex flex-col-12 w-full pb-5 ">
               <div class="flex flex-col-6">
                    <button type="button" (click)="openDetailFormDialog()" class="p-2 bg-blue-300 font-bold border border-solid border-black rounded-md px-3" >Add</button>
               </div>
          </div> -->
          <div class="overflow-x-scroll overflow-y-hidden">
               <table mat-table [dataSource]="dataSource">
                    <ng-container matColumnDef="Description">
                         <th mat-header-cell *matHeaderCellDef>Description</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.description}}</span></td>
                    </ng-container>

                    <ng-container matColumnDef="Remarks">
                         <th mat-header-cell *matHeaderCellDef>Remarks</th>
                         <td mat-cell *matCellDef="let element"><span>{{element.remarks}}</span></td>
                    </ng-container>

                    <ng-container matColumnDef="Amount">
                         <th mat-header-cell *matHeaderCellDef>Total Amount</th>
                         <td mat-cell *matCellDef="let element"><span> {{numberFormat(sanitizeAmount(element.amount))}}</span></td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="tableColumns; sticky: true" ></tr>
                    <tr mat-row *matRowDef="let row; columns: tableColumns;"></tr>
               </table>
          </div>
     
     </form>

</div>
