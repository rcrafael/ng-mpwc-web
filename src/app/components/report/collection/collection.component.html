<div class="h-screen flex flex-col m-1">
    <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
        <div class="flex flex-col-12 w-full">
            <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                <span class="p-2 font-bold">COLLECTION REPORT</span>
            </div>
        </div>
    </div>

    <!-- date presets -->
    <div class="grid grid-cols-2 md:grid-cols-6 lg:grid-cols-12 gap-3 m-5 mb-0">
        <div [ngClass]="datePresetStyles" (click)="onDatePresetClick('Daily')">
            Daily
        </div>
        <div [ngClass]="datePresetStyles" (click)="onDatePresetClick('Weekly')">
            Weekly
        </div>
        <div [ngClass]="datePresetStyles" (click)="onDatePresetClick('Monthly')">
            Monthly
        </div>
        <div [ngClass]="datePresetStyles" (click)="onDatePresetClick('Yearly')">
            Yearly
        </div>
    </div>

    <!-- filters -->
    <form [formGroup]="formGroup">
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 m-5 border border-gray-200 rounded-md p-2">
            <div>
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" formControlName="startDate" [ngClass]="commonStyles.inputDateStyle">
            </div>
            <div>
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" formControlName="endDate" [ngClass]="commonStyles.inputDateStyle">
            </div>
            <div [hidden]="">
                <label for="branchCode">Branch Code:</label>
                <select id="branchCode" [ngClass]="commonStyles.selectStyle" formControlName="branchCode">
                    <option value="-1">All</option>
                    <option value="1">Branch 1</option>
                    <option value="2">Branch 2</option>
                </select>
            </div>
            <div>
                <label for="phase">Phase:</label>
                <select id="phase" [ngClass]="commonStyles.selectStyle" formControlName="phase">
                    <option value="-1">All</option>
                    <option value="1">Phase 1</option>
                    <option value="2">Phase 2</option>
                </select>
            </div>
            <div>
                <button type="submit" class="bg-green-300" [ngClass]="commonStyles.buttonStyle"
                    (click)="onGenerateReportClick()">Generate Report</button>
            </div>
        </div>
    </form>


    <!-- report types -->
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 m-5 border border-gray-200 rounded-md p-2">
        @for (report of collectionReports; track report.title) {
        <div [class]="commonStyles.reportCardStyle" (click)="onReportTypeClick(report)"
            [ngClass]="{'bg-gray-300 border border-solid border-black':activeCard === report.id}">
            <p>{{ report.title }}</p>
        </div>
        }
    </div>

</div>
