<div class="h-screen flex flex-col m-1">
    <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
        <div class="flex flex-col-12 w-full">
            <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                <span class="p-2 font-bold">REPORTS</span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 m-5">

        @for(report of reportNav; track report.route){
        <app-report-cards [title]="report.title" [icon]="report.icon" (click)="handleReportOnClick(report.route)">
        </app-report-cards>
        }

    </div>

</div>
