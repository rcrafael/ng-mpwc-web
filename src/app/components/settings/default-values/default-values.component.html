<div class="m-1">
     <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
          <div class="flex flex-col-12 w-full">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center m-1">
                    <span class="p-2 font-bold">DEFAULT VALUES</span>
               </div>
          </div>
     </div>
     <form [formGroup]="fg" (ngSubmit)="handleSubmit()">
          <div class="h-full w-full p-10">
               <div class="flex flex-col gap-5 item-center justify-center p-10">

                    <div class="flex flex-row gap-5 items-center justify-start">
                         <label class="font-bold w-64">
                              Maintenance Fee:
                         </label>
                         <input type="text" formControlName="maintenanceFee" 
                              (blur)="handleOnBlur($event,'maintenanceFee')"
                              class="text-right  border border-gray-500 rounded-md">
                    </div>

                    <div class="flex flex-row gap-5 items-center justify-start">
                         <label class="font-bold w-64">
                              Reconnection Fee:
                         </label>
                         <input type="text" formControlName="reconnectionFee" 
                              (blur)="handleOnBlur($event,'reconnectionFee')"
                              class="text-right  border border-gray-500 rounded-md">
                    </div>

                    <div class="flex flex-row gap-5 items-center justify-start">
                         <label class="font-bold w-64">
                              Penalty Percentage:
                         </label>
                         <input type="text" formControlName="penaltyPercentage" 
                              (blur)="handleOnBlur($event,'penaltyPercentage')"
                              class="text-right  border border-gray-500 rounded-md">
                    </div>

                    <div class="flex flex-row gap-5 items-center justify-start">
                         <button type="button"
                              (click)="handleReset()"
                              class="bg-red-300 border border-solid border-black text-black rounded-md w-[80px] p-2">Reset</button>
                         <button type="submit"
                              class="bg-green-300 border border-solid border-black text-black rounded-md w-[80px] p-2">Update</button>
                    </div>

               </div>
          </div>

     </form>
</div>
