<div class="p-5">
     <mat-dialog-content>
          
          <div >
               <div class="modal-header flex flex-row items-start mb-5 font-bold text-black">
                    <h3>Create New Item</h3>
               </div>
               <form [formGroup]="formGroup" (ngSubmit)="handleSave()">
                    <div class="grid grid-flow-row gap-3">
                         <div class="grid grid-cols-6 grid-flow-col items-center">
                              <div class="col-span-1">
                                   <label for="description">Description:</label> 
                              </div>
                              <div class="col-span-5">
                                   <input type="text" id="description" formControlName="description" class="border border-gray-400 rounded-md w-[50%]">
                              </div>
                         </div>
                         <div class="grid grid-cols-6 grid-flow-col items-center">
                              <div class="col-span-1">
                                   <label for="measurement">Measurement:</label>
                              </div>
                              <div class="col-span-5">
                                   <input type="text" id="measurement" formControlName="measurement" class="border border-gray-400 rounded-md w-[50%]"> 
                              </div>
                         </div>
                         <div class="grid grid-cols-6 grid-flow-col items-center">
                              <div class="col-span-1">
                                   <label for="unit-cost">Unit Cost:</label>
                              </div>
                              <div class="col-span-5">
                                   <input type="text" id="unit-cost" formControlName="unitCost" class="border border-gray-400 rounded-md" (blur)="handleOnBlurAmount()">
                              </div>
                         </div>
                         <div class="grid grid-cols-6 grid-flow-col items-center">
                              <div class="col-span-1">
                                   <label for="selling-price">Selling Price:</label>
                              </div>
                              <div class="col-span-5">
                                   <input type="text" id="selling-print" formControlName="sellingPrice" class="border border-gray-400 rounded-md" (blur)="handleOnBlurAmount()">
                              </div>
                         </div>
                    </div>
                    <div class="xs:col-span-12 md:col-span-2 my-5">
                         <div class="grid grid-flow-col gap-2 justify-start">
                              <div class="xs:col-span-12 md:col-span-4">
                                   <button type="button" (click)="handleReset()" class="bg-red-300 border border-solid border-black text-black rounded-md w-[80px] p-2" >Reset</button>
                              </div>
                              <div class="xs:col-span-12 md:col-span-4">
                                   <button type="submit" class="bg-green-300 border border-solid border-black text-black rounded-md w-[80px] p-2" >Add</button>
                              </div>
                         </div>
                    </div>
               </form>
          </div>
     </mat-dialog-content>

     <mat-dialog-actions>
          <div class="flex flex-row w-full gap-3 justify-end">
               <button type="button" (click)="handleCloseDialog()" class="bg-gray-100 text-black rounded border border-black border-solid p-2 w-[80px]">
                    Close
               </button>
          </div>
     </mat-dialog-actions>
</div>
