<div class="h-screen flex flex-col m-1">
     <div class="flex flex-row w-full mb-1 bg-slate-200 rounded-md p-1">
          <div class="flex flex-col-12 w-full">
               <div class="flex col-span-6 col-start-1 w-full  place-items-center ">
                    <span class="p-2 font-bold">ITEM MASTER LIST</span>
               </div>
               <div class="flex col-span-6 col-start-7 w-full place-content-end">
                    <button type="button" class="p-2 bg-green-300 font-bold border border-solid border-black rounded-md " (click)="onCreateNewClick()">Create New</button>
               </div>
          </div>
     </div>

     <div class="flex flex-col flex-1 min-h-0">
           @if(dataSource.data.length === 0) {
               <!-- <div>Please wait while loading...</div> -->
                <div class="flex-1 flex items-center justify-center">
                    <app-no-data-to-display></app-no-data-to-display>
                </div>
               
          } @else {
               <div class="flex-1 overflow-auto min-h-0">
                    <div *ngIf="dataSource.data.length > 0" class="h-full">
                         <table mat-table [dataSource]="dataSource" class="w-full border-collapse">
                              <ng-container matColumnDef="Description">
                                   <th mat-header-cell *matHeaderCellDef>Description</th>
                                   <td mat-cell *matCellDef="let element"> <span>{{element.description}}</span> </td>
                              </ng-container>
                              <ng-container matColumnDef="Measurement">
                                   <th mat-header-cell *matHeaderCellDef>Measurement</th>
                                   <td mat-cell *matCellDef="let element"> <span>{{element.measurement}}</span> </td>
                              </ng-container>
                              <ng-container matColumnDef="Unit Cost">
                                   <th mat-header-cell *matHeaderCellDef>Unit Cost</th>
                                   <td mat-cell *matCellDef="let element"> <span>{{formatAmount(element.unitCost)}}</span> </td>
                              </ng-container>
                              <ng-container matColumnDef="Selling Price">
                                   <th mat-header-cell *matHeaderCellDef>Selling Price</th>
                                   <td mat-cell *matCellDef="let element"> <span>{{formatAmount(element.sellingPrice)}}</span> </td>
                              </ng-container>
                              <ng-container matColumnDef="Actions">
                                   <th mat-header-cell *matHeaderCellDef class="!text-center"><span>Actions</span></th>
                                   <td mat-cell *matCellDef="let element">
                                        <div class="flex flex-row gap-4 justify-center">
                                             <mat-icon 
                                                  fontIcon="edit" 
                                                  class="cursor-pointer text-blue-500"
                                                  matTooltip="Edit Item"
                                                  (click)="handleEditRecord(element.id)"
                                             ></mat-icon>
                                             <mat-icon 
                                                  fontIcon="delete_forever"
                                                  matTooltip="Delete Billing"
                                                  class="cursor-pointer text-red-500" 
                                                  (click)="handleDeleteRecord(element.id)"
                                             ></mat-icon>
                                        </div>
                                   </td>
                              </ng-container>

                              <tr mat-header-row *matHeaderRowDef="tableCols; sticky: true" ></tr>
                              <tr mat-row *matRowDef="let row; columns: tableCols;"></tr>
                         </table>
                    </div>
               </div>
          }
          <mat-paginator
               showFirstLastButtons
               aria-label="Select page of billings"
               [pageSizeOptions]="[50,100,200]"
               (page)="handlePageChange($event)"
               
          >
          </mat-paginator>
     
     </div>

</div>
