<form [formGroup]="fg" (submit)="handleSubmit()">


     <div class="flex flex-col gap-5 items-center justify-center p-10">

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    0 to 15 cubic meters :
               </label>
               <input type="text" formControlName="zeroToFifteen" (blur)="handleInputOnBlur($event)" placeholder="0.0"
                    class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    16 to 30 cubic meters :
               </label>
               <input type="text" formControlName="sixteenToThirty" (blur)="handleInputOnBlur($event)" placeholder="0.0"
                    class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    31 to 500 cubic meters :
               </label>
               <input type="text" formControlName="thirtyOneToFiveHundred" (blur)="handleInputOnBlur($event)"
                    placeholder="0.0" class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Over 501 cubic meters :
               </label>
               <input type="text" formControlName="OverFiveHundredOne" (blur)="handleInputOnBlur($event)"
                    placeholder="0.0" class="text-right border border-gray-400 rounded-md">
          </div>


          <div class="flex flex-row gap-5 items-center justify-start">
               <button type="button" (click)="handleReset()"
                    class="bg-red-300 border border-solid border-black text-black rounded-md w-[80px] p-2">Reset</button>
               <button type="submit"
                    class="bg-green-300 border border-solid border-black text-black rounded-md w-[80px] p-2">Update</button>
          </div>

     </div>
</form>
