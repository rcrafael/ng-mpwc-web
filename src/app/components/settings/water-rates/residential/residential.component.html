<form [formGroup]="fg" (ngSubmit)="handleSubmit()">

     <div class="flex flex-col gap-5 items-center justify-center p-10">

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Less than or Equal to 5 :
               </label>
               <input type="text" formControlName="lessEqualToFive" placeholder="0.0" (blur)="handleInputOnBlur($event)"
                    class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Less than or Equal to 10 :
               </label>
               <input type="text" formControlName="sixToTen" placeholder="0.0" (blur)="handleInputOnBlur($event)"
                    class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Less than or Equal to 20 :
               </label>
               <input type="text" formControlName="elevenToTwenty" placeholder="0.0" (blur)="handleInputOnBlur($event)"
                    class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Less than or Equal to 30 :
               </label>
               <input type="text" formControlName="twentyOneToThirty" placeholder="0.0"
                    (blur)="handleInputOnBlur($event)" class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Less than or Equal to 40 :
               </label>
               <input type="text" formControlName="thirtyOneToFourty" placeholder="0.0"
                    (blur)="handleInputOnBlur($event)" class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
               <label class="font-bold w-64">
                    Less than or Equal to 50 :
               </label>
               <input type="text" formControlName="greaterThanFourtyOne" placeholder="0.0"
                    (blur)="handleInputOnBlur($event)" class="text-right border border-gray-400 rounded-md">
          </div>

          <div class="flex flex-row gap-5 items-center justify-start">
